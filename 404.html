<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Same policy as index.html; this page makes no API calls, so connect-src stays closed -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Page not found | Peter Paul Ungab</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />

  <!-- Absolute paths: GitHub Pages serves this file for any missing URL, at any depth -->
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="/css/styles.css" />

  <!-- Blocks framing by other sites -->
  <script src="/js/boot.js"></script>
</head>

<body>
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop__stars backdrop__stars--far"></div>
    <div class="backdrop__stars backdrop__stars--near"></div>
    <div class="backdrop__orb backdrop__orb--a"></div>
    <div class="backdrop__orb backdrop__orb--b"></div>
  </div>

  <header class="site-header">
    <nav class="nav container" aria-label="Primary">
      <a href="/" class="nav__logo" aria-label="Peter Paul Ungab — home">
        <span class="nav__logo-mark" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>
        </span>
        <span class="nav__logo-text">Peter <span>Ungab</span></span>
      </a>
    </nav>
  </header>

  <main class="hero notfound" id="main">
    <div class="hero__grid" aria-hidden="true"></div>
    <div class="container hero__inner">
      <p class="badge">
        <span class="badge__dot" aria-hidden="true"><span></span></span>
        Error 404 · Lost in space
      </p>
      <p class="notfound__code text-gradient" aria-hidden="true">404</p>
      <h1 class="notfound__title">This page doesn't exist<span class="dot" aria-hidden="true">.</span></h1>
      <p class="notfound__text">The link may be broken or the page may have moved. Everything I've built is still one click away.</p>
      <div class="hero__cta">
        <a href="/" class="btn btn--primary">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
          Back to home
        </a>
        <a href="/#projects" class="btn btn--outline">View my projects</a>
      </div>
    </div>
  </main>
</body>
</html>
