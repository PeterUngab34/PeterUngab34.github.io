<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Same policy as index.html; this page makes no API calls, so connect-src stays closed -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Page not found | Peter Paul Ungab</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f4f1ea" />

  <!-- Absolute paths: GitHub Pages serves this file for any missing URL, at any depth -->
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="/css/styles.css" />

  <!-- Applies the saved theme before paint and blocks framing by other sites -->
  <script src="/js/theme.js"></script>
</head>

<body>
  <header class="site-header">
    <nav class="nav container" aria-label="Primary">
      <a href="/" class="nav__logo">
        <span class="nav__logo-mark" aria-hidden="true">PU</span>
        <span class="nav__logo-text">Peter Paul Ungab</span>
      </a>
    </nav>
  </header>

  <main class="hero notfound" id="main">
    <div class="container">
      <div class="notfound__inner">
        <p class="doc-line"><span>Error</span><span>HTTP 404</span><span>Sheet not found</span></p>
        <p class="notfound__code" aria-hidden="true">404</p>
        <h1 class="notfound__title">This page doesn't exist</h1>
        <p class="notfound__text">The link may be broken or the page may have moved. Everything I've built is still one click away.</p>
        <div class="notfound__actions">
          <a href="/" class="btn btn--primary">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
            Back to index
          </a>
          <a href="/#projects" class="btn btn--outline">View my projects</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
