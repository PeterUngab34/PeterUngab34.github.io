<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560" role="img" aria-label="PU monogram">
  <!-- Red Noir monogram plate. Swap for a real portrait via profile.photo in js/data.js. -->
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0a0a"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="56%">
      <stop offset="0" stop-color="#ef233c" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#ef233c" stop-opacity=".1"/>
      <stop offset="1" stop-color="#ef233c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b7d"/>
      <stop offset=".5" stop-color="#ef233c"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="480" height="560" fill="url(#wash)"/>
  <rect width="480" height="560" fill="url(#grid)"/>
  <rect width="480" height="560" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="62" cy="84" r="1.2" opacity=".8"/>
    <circle cx="410" cy="58" r="1" opacity=".6"/>
    <circle cx="356" cy="142" r="1.4" opacity=".7"/>
    <circle cx="96" cy="212" r="1" opacity=".5"/>
    <circle cx="430" cy="300" r="1.2" opacity=".6"/>
    <circle cx="48" cy="388" r="1.3" opacity=".7"/>
    <circle cx="300" cy="470" r="1" opacity=".5"/>
    <circle cx="150" cy="500" r="1.2" opacity=".6"/>
  </g>

  <!-- orbit rings -->
  <g fill="none" stroke="#fff" stroke-opacity=".12">
    <circle cx="240" cy="248" r="152"/>
    <circle cx="240" cy="248" r="116" stroke-dasharray="2 8"/>
  </g>
  <circle cx="347" cy="140" r="5" fill="#ef233c"/>

  <!-- monogram -->
  <text x="240" y="300" text-anchor="middle" font-family="Manrope, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="150" font-weight="800" letter-spacing="-8" fill="url(#ink)">PU</text>
</svg>
