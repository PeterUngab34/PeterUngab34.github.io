<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560" role="img" aria-label="PU monogram">
  <!-- Drafted monogram plate. Swap for a real portrait via profile.photo in js/data.js. -->
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#15171a" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="480" height="560" fill="#e9e4d8"/>
  <rect width="480" height="560" fill="url(#grid)"/>

  <!-- construction lines -->
  <g fill="none" stroke="#15171a" stroke-opacity=".35" stroke-width="1">
    <path d="M240 40V520M40 268H440" stroke-dasharray="10 5 2 5"/>
    <circle cx="240" cy="268" r="150"/>
    <circle cx="240" cy="268" r="112" stroke-dasharray="3 5"/>
  </g>

  <!-- monogram -->
  <text x="240" y="318" text-anchor="middle" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="150" font-weight="700" letter-spacing="-4" fill="#15171a">PU</text>

  <!-- dimension line -->
  <g stroke="#e8590c" stroke-width="1.5" fill="none">
    <path d="M90 452H390M90 444V460M390 444V460"/>
    <path d="M98 448 90 452 98 456M382 448 390 452 382 456"/>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="1.5">
    <text x="240" y="480" text-anchor="middle" fill="#b13d08">Ø 300</text>
    <text x="40" y="60" fill="#4a4f55">PPU-2028</text>
    <text x="440" y="60" text-anchor="end" fill="#4a4f55">SCALE 1:1</text>
  </g>

  <!-- registration marks -->
  <g stroke="#15171a" stroke-width="1" fill="none">
    <path d="M24 16V32M16 24H32M456 528V544M448 536H464"/>
  </g>
</svg>
